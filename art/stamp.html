<!doctype html>
<meta charset="utf-8" />
<style>
  /* 360x360 = 3x the 120px the sticker card renders it at, object-contain.
     Transparent: the card supplies its own pale fill behind this. */
  html, body { margin: 0; padding: 0; background: transparent; }
  body { width: 360px; height: 360px; overflow: hidden; }
</style>
<body>
  <svg width="360" height="360" viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
    <!-- Hexagon matching the placeholder the card falls back to
         (StickerCard.tsx: polygon 60,8 105,34 105,86 60,112 15,86 15,34),
         so a card with art and a card without still read as the same family. -->
    <g>
      <polygon points="60,10 103,35 103,85 60,110 17,85 17,35"
               fill="#fff454" stroke="#222" stroke-width="6" stroke-linejoin="round" />
      <polygon points="60,20 94.5,40 94.5,80 60,100 25.5,80 25.5,40"
               fill="none" stroke="#222" stroke-width="2" stroke-linejoin="round" opacity="0.35" />

      <!-- Question mark: what the activity is. -->
      <text x="60" y="76" text-anchor="middle"
            font-family="'SF Pro Rounded','Noto Sans Thai',-apple-system,sans-serif"
            font-size="52" font-weight="800" fill="#222">?</text>
    </g>

    <!-- Answered: the check badge overlaps the hexagon's lower-right edge. -->
    <g transform="translate(88 88)">
      <circle r="16" fill="#1ac57d" stroke="#222" stroke-width="5" />
      <path d="M-7 0.5l5 5 9-10.5" fill="none" stroke="#fff" stroke-width="5"
            stroke-linecap="round" stroke-linejoin="round" />
    </g>

    <!-- Sparks, borrowed from the app's 4-point star motif. -->
    <g fill="#c98a00">
      <path d="M20 18c1.6 5.4 2.6 6.4 8 8-5.4 1.6-6.4 2.6-8 8-1.6-5.4-2.6-6.4-8-8 5.4-1.6 6.4-2.6 8-8z" />
      <path d="M101 16c1.1 3.7 1.8 4.4 5.5 5.5-3.7 1.1-4.4 1.8-5.5 5.5-1.1-3.7-1.8-4.4-5.5-5.5 3.7-1.1 4.4-1.8 5.5-5.5z" opacity="0.8" />
      <path d="M15 99c1.1 3.7 1.8 4.4 5.5 5.5-3.7 1.1-4.4 1.8-5.5 5.5-1.1-3.7-1.8-4.4-5.5-5.5 3.7-1.1 4.4-1.8 5.5-5.5z" opacity="0.8" />
    </g>
  </svg>
</body>
