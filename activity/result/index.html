<!doctype html>
<html lang="th">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#F2F2F7" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)" />
    <meta name="robots" content="noindex" />
    <title>เฉลยกิจกรรม — คำถามชวนคิด</title>
    <link rel="stylesheet" href="../../app.css" />
  </head>
  <body>
    <!--
      /activity/result/ — the bare directory form. The path form Dreambook
      actually links to (/activity/result/<result_id>) has no file behind it on
      a static host, so the root 404.html shim renders that one. Both show the
      same answer key; the id in the URL isn't read.
    -->
    <main id="app"></main>
    <script src="../../quiz.js"></script>
    <script src="../../result.js"></script>
  </body>
</html>
